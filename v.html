<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a4a36">
<title>PMOC Digital — Consulta</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  :root{--verde:#0a4a36;--verde-mid:#1a7a55;--verde-bg:#e6f5f0;--bg:#f4f6f5;--text:#1a1a1a;--text-2:#555;--text-3:#999;--red:#b83232;--amber:#c07a1a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px;}
  .header{background:var(--verde);color:white;padding:14px 18px;display:flex;align-items:center;gap:12px;}
  .logo{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .header h1{font-size:15px;font-weight:700;} .header p{font-size:11px;opacity:.75;}
  .container{max-width:600px;margin:0 auto;padding:14px;}
  .card{background:white;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  .card-title{font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .eq-name{font-size:20px;font-weight:700;margin-bottom:2px;}
  .eq-sub{font-size:13px;color:var(--text-2);}
  .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;background:var(--verde-bg);color:var(--verde);font-weight:600;margin-top:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .info{padding:8px 10px;background:var(--bg);border-radius:8px;}
  .info .lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
  .info .val{font-size:13px;font-weight:600;}
  /* Manutenção items — clickable */
  .manut-item{border-left:3px solid var(--verde);padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:10px;cursor:pointer;transition:background .15s;}
  .manut-item:hover{background:#dff0ea;}
  .manut-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .manut-item .data{font-size:13px;font-weight:700;}
  .manut-item .tec{font-size:12px;color:var(--text-2);}
  .chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
  .chip-ok{background:var(--verde-bg);color:var(--verde);}
  .chip-warn{background:#faeeda;color:var(--amber);}
  .chip-bad{background:#fdeaea;color:var(--red);}
  /* Manutenção detail modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow-y:auto;padding:20px 16px;}
  .overlay.open{display:block;}
  .modal{background:white;border-radius:16px;padding:20px;max-width:560px;margin:0 auto;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-header h2{font-size:16px;font-weight:700;}
  .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-3);line-height:1;}
  .check-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
  .check-row:last-child{border-bottom:none;}
  .s-conf{color:var(--verde);font-weight:700;font-size:11px;}
  .s-nconf{color:var(--red);font-weight:700;font-size:11px;}
  .s-na{color:var(--text-3);font-size:11px;}
  .s-pend{color:var(--amber);font-weight:700;font-size:11px;}
  /* Equipamentos da empresa */
  .eq-chip{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px;cursor:pointer;text-decoration:none;color:inherit;transition:background .15s;}
  .eq-chip:hover{background:#dff0ea;}
  .eq-chip .ico{width:36px;height:36px;background:var(--verde-bg);color:var(--verde);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .eq-chip .inf .nm{font-size:13px;font-weight:600;}
  .eq-chip .inf .sub{font-size:11px;color:var(--text-3);}
  /* PMOC download */
  .pmoc-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px;}
  .pmoc-icon{width:40px;height:40px;background:var(--verde-bg);color:var(--verde);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .pmoc-info{flex:1;}
  .pmoc-info .num{font-size:13px;font-weight:700;}
  .pmoc-info .dt{font-size:11px;color:var(--text-3);}
  .btn-down{background:var(--verde);color:white;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .empty{text-align:center;padding:20px;color:var(--text-3);font-size:13px;}
  .loader{text-align:center;padding:60px 20px;color:var(--text-2);}
  .spin{animation:spin 1s linear infinite;display:inline-block;font-size:32px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .footer{text-align:center;font-size:11px;color:var(--text-3);margin-top:16px;padding:0 16px;}
  .summary-boxes{display:flex;gap:8px;margin-bottom:12px;}
  .sum-box{flex:1;border-radius:8px;padding:8px;text-align:center;}
  .sum-box .n{font-size:18px;font-weight:700;}
  .sum-box .l{font-size:9px;text-transform:uppercase;font-weight:600;}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><i class="ti ti-air-conditioning"></i></div>
  <div><h1>PMOC Digital</h1><p>Consulta pública de equipamento</p></div>
</div>
<div class="container" id="conteudo">
  <div class="loader"><div class="spin"><i class="ti ti-loader-2"></i></div><p style="margin-top:12px">Carregando...</p></div>
</div>
<div class="footer">Sistema PMOC Digital · Desenvolvido por Eng. Alex Luiz de Souza Leandro</div>

<!-- Modal detalhe manutenção -->
<div class="overlay" id="manut-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="manut-modal-title">Detalhes da Manutenção</h2>
      <button class="close-btn" onclick="fecharManutModal()">✕</button>
    </div>
    <div id="manut-modal-body"></div>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAh4YpyJNt7H_tyB1SLyyEBiADoTjpmvAE",
  authDomain:"pmoc-digital-1674e.firebaseapp.com",
  projectId:"pmoc-digital-1674e",
  storageBucket:"pmoc-digital-1674e.firebasestorage.app",
  messagingSenderId:"706853488629",
  appId:"1:706853488629:web:64995072fd57845767c2bc"
});
const firestore = firebase.firestore();

function esc(s){return (s||'').toString().replace(/[<>&"]/g,x=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[x]));}
function getParam(n){return new URL(location.href).searchParams.get(n);}

let _eq=null,_empresa=null,_pmocs=[],_manut=[],_todosEquips=[];

function fecharManutModal(){document.getElementById('manut-modal').classList.remove('open');}

function verManutencao(idx){
  const m=_manut.slice().reverse()[idx];
  if(!m) return;
  const conf=(m.atividades||[]).filter(a=>a.status==='Conforme').length;
  const nconf=(m.atividades||[]).filter(a=>a.status==='Não conforme').length;
  const na=(m.atividades||[]).filter(a=>a.status==='N/A').length;
  const pend=(m.atividades||[]).filter(a=>a.status==='Pendente').length;
  document.getElementById('manut-modal-title').textContent='Manutenção de '+m.data+(m.hora?' às '+m.hora:'');
  let body='';
  body+='<div style="font-size:12px;color:var(--text-2);margin-bottom:12px">👤 '+esc(m.tec1Nome||'')+(m.tec2Nome?' + '+esc(m.tec2Nome):'')+' · '+esc(m.equipTipo||_eq?.tipo||'')+'</div>';
  body+='<div class="summary-boxes">';
  body+='<div class="sum-box" style="background:var(--verde-bg)"><div class="n" style="color:var(--verde)">'+conf+'</div><div class="l" style="color:var(--verde)">Conforme</div></div>';
  body+='<div class="sum-box" style="background:#fdeaea"><div class="n" style="color:var(--red)">'+nconf+'</div><div class="l" style="color:var(--red)">Não conforme</div></div>';
  body+='<div class="sum-box" style="background:#faeeda"><div class="n" style="color:var(--amber)">'+pend+'</div><div class="l" style="color:var(--amber)">Pendente</div></div>';
  body+='<div class="sum-box" style="background:#f4f4f4"><div class="n" style="color:var(--text-3)">'+na+'</div><div class="l" style="color:var(--text-3)">N/A</div></div>';
  body+='</div>';
  body+='<div style="font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Check-list</div>';
  (m.atividades||[]).forEach(a=>{
    const cls=a.status==='Conforme'?'s-conf':a.status==='Não conforme'?'s-nconf':a.status==='N/A'?'s-na':'s-pend';
    const ico=a.status==='Conforme'?'✓':a.status==='Não conforme'?'✗':a.status==='N/A'?'—':'⚠';
    body+='<div class="check-row"><span style="flex:1;padding-right:10px">'+esc(a.label)+'</span><span class="'+cls+'">'+ico+' '+esc(a.status)+'</span></div>';
  });
  if(m.obs) body+='<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text-2)">📝 '+esc(m.obs)+'</div>';
  document.getElementById('manut-modal-body').innerHTML=body;
  document.getElementById('manut-modal').classList.add('open');
}

async function carregar(){
  const code=getParam('c')||getParam('e');
  if(!code){show('<div class="card"><div class="empty"><i class="ti ti-qrcode-off" style="font-size:36px;opacity:.3"></i><p style="margin-top:10px">QR Code inválido.</p></div></div>');return;}
  try{
    const col=firestore.collection('empresas_dados');
    const metaDoc=await col.doc('equip_meta').get();
    let equips=[];
    if(metaDoc.exists){
      const meta=metaDoc.data();
      const docs=await Promise.all(Array.from({length:meta.chunks},(_,i)=>col.doc('equip_'+i).get()));
      docs.forEach(d=>{if(d.exists) equips=equips.concat(d.data().items||[]);});
    }
    _todosEquips=equips;
    const eq=equips.find(e=>e.qrcode===code||e.id===code||e.tag===code||e.serie===code);
    if(!eq){show('<div class="card"><div class="empty"><i class="ti ti-search-off" style="font-size:36px;opacity:.3"></i><p style="margin-top:10px">Equipamento não encontrado.</p><p style="font-size:11px;margin-top:4px">Código: '+esc(code)+'</p></div></div>');return;}
    _eq=eq;
    let empresa=null;
    if(eq.empresaId){const ed=await col.doc('emp_'+eq.empresaId).get();if(ed.exists) empresa=ed.data();}
    _empresa=empresa;
    const manutDoc=await col.doc('manutencoes').get();
    _manut=manutDoc.exists?(manutDoc.data().items||[]).filter(m=>m.equipId===eq.id):[];
    const pmocsDoc=await col.doc('pmocs').get();
    _pmocs=pmocsDoc.exists?(pmocsDoc.data().items||[]).filter(p=>p.empId===eq.empresaId):[];
    render();
  }catch(e){
    console.error(e);
    show('<div class="card"><div class="empty"><i class="ti ti-wifi-off" style="font-size:36px;opacity:.3"></i><p style="margin-top:10px">Erro ao carregar.</p></div></div>');
  }
}

function show(html){document.getElementById('conteudo').innerHTML=html;}

function render(){
  const eq=_eq,empresa=_empresa,manutencoes=_manut,pmocs=_pmocs;
  let html='';

  // Equipamento
  html+='<div class="card">';
  html+='<div class="eq-name">'+esc(eq.tipo)+(eq.tag?' · '+esc(eq.tag):'')+'</div>';
  html+='<div class="eq-sub">'+esc(((eq.marca||'')+' '+(eq.modelo||'')).trim())+'</div>';
  if(eq.freq) html+='<span class="badge">Manutenção '+esc(eq.freq)+'</span>';
  html+='<div class="grid2">';
  if(eq.btu)   html+='<div class="info"><div class="lbl">Capacidade</div><div class="val">'+esc(eq.btu)+' BTU</div></div>';
  if(eq.gas)   html+='<div class="info"><div class="lbl">Refrigerante</div><div class="val">'+esc(eq.gas)+'</div></div>';
  if(eq.local) html+='<div class="info"><div class="lbl">Localização</div><div class="val">'+esc(eq.local)+'</div></div>';
  if(eq.area)  html+='<div class="info"><div class="lbl">Área</div><div class="val">'+esc(eq.area)+' m²</div></div>';
  if(eq.patrimonio) html+='<div class="info"><div class="lbl">Patrimônio</div><div class="val">'+esc(eq.patrimonio)+'</div></div>';
  if(eq.serie) html+='<div class="info"><div class="lbl">Nº Série</div><div class="val">'+esc(eq.serie)+'</div></div>';
  html+='</div></div>';

  // Empresa + outros equipamentos
  if(empresa){
    html+='<div class="card"><div class="card-title"><i class="ti ti-building"></i> Empresa</div>';
    html+='<div class="info" style="margin-bottom:8px"><div class="lbl">Razão Social</div><div class="val">'+esc(empresa.nome)+'</div></div>';
    if(empresa.cnpj) html+='<div class="info" style="margin-bottom:8px"><div class="lbl">CNPJ</div><div class="val">'+esc(empresa.cnpj)+'</div></div>';
    const end=[empresa.rua,empresa.numero,empresa.bairro,empresa.cidade,empresa.uf].filter(Boolean).join(', ');
    if(end) html+='<div class="info" style="margin-bottom:12px"><div class="lbl">Endereço</div><div class="val" style="font-size:12px">'+esc(end)+'</div></div>';

    // Other equipment of same company
    const outros=_todosEquips.filter(e=>e.empresaId===eq.empresaId && e.id!==eq.id);
    if(outros.length>0){
      html+='<div style="font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Outros equipamentos desta empresa ('+outros.length+')</div>';
      outros.forEach(e=>{
        const url='?c='+(e.qrcode||e.id);
        html+='<a class="eq-chip" href="'+url+'">';
        html+='<div class="ico"><i class="ti ti-air-conditioning"></i></div>';
        html+='<div class="inf"><div class="nm">'+esc(e.tipo)+(e.tag?' · '+esc(e.tag):'')+'</div>';
        html+='<div class="sub">'+esc(e.local||'')+(e.btu?' · '+esc(e.btu)+' BTU':'')+'</div></div>';
        html+='<i class="ti ti-chevron-right" style="color:var(--text-3);font-size:16px"></i></a>';
      });
    }
    html+='</div>';
  }

  // PMOCs com botão download
  html+='<div class="card"><div class="card-title"><i class="ti ti-file-text"></i> Planos PMOC ('+pmocs.length+')</div>';
  if(pmocs.length===0){
    html+='<div class="empty">Nenhum plano PMOC disponível</div>';
  }else{
    pmocs.slice().reverse().forEach((p,idx)=>{
      html+='<div class="pmoc-card">';
      html+='<div class="pmoc-icon"><i class="ti ti-file-certificate"></i></div>';
      html+='<div class="pmoc-info"><div class="num">PMOC '+(p.num||'')+'/'+(p.ano||'')+'</div>';
      html+='<div class="dt">Gerado em '+esc(p.data||'')+(p.artNum?' · ART: '+esc(p.artNum):'')+'</div></div>';
      html+='<button class="btn-down" onclick="baixarPMOC('+idx+')"><i class="ti ti-download"></i> PDF</button>';
      html+='</div>';
    });
  }
  html+='</div>';

  // Manutenções — clickable
  html+='<div class="card"><div class="card-title"><i class="ti ti-tool"></i> Manutenções ('+manutencoes.length+')</div>';
  if(manutencoes.length===0){
    html+='<div class="empty">Nenhuma manutenção registrada</div>';
  }else{
    manutencoes.slice().reverse().forEach((m,idx)=>{
      const conf=(m.atividades||[]).filter(a=>a.status==='Conforme').length;
      const nconf=(m.atividades||[]).filter(a=>a.status==='Não conforme').length;
      const total=(m.atividades||[]).length;
      const chipCls=nconf>0?'chip-bad':conf===total&&total>0?'chip-ok':'chip-warn';
      html+='<div class="manut-item" onclick="verManutencao('+idx+')">';
      html+='<div class="top"><span class="data">'+esc(m.data)+(m.hora?' · '+esc(m.hora):'')+'</span>';
      html+='<span class="chip '+chipCls+'">'+conf+'/'+total+' OK</span></div>';
      html+='<div class="tec">👤 '+esc(m.tec1Nome||'')+(m.tec2Nome?' + '+esc(m.tec2Nome):'')+'</div>';
      html+='<div style="font-size:11px;color:var(--text-3);margin-top:3px">Toque para ver detalhes →</div>';
      html+='</div>';
    });
  }
  html+='</div>';

  show(html);
}

function baixarPMOC(idx){
  const p=_pmocs.slice().reverse()[idx];
  if(!p){alert('PMOC não disponível');return;}
  if(typeof window.jspdf==='undefined'){alert('Aguarde...');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const M=15;let y=20;
  doc.setFillColor(10,74,54);doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);doc.setFont(undefined,'bold');doc.setFontSize(16);
  doc.text('PMOC — Plano de Manutenção',M,12);
  doc.setFontSize(10);doc.setFont(undefined,'normal');
  doc.text('Operação e Controle de Climatização',M,20);y=40;
  doc.setTextColor(30,30,30);doc.setFontSize(11);doc.setFont(undefined,'bold');
  doc.text('Empresa: '+(_empresa?.nome||p.empNome||''),M,y);y+=8;
  doc.text('PMOC Nº: '+(p.num||'')+' / '+(p.ano||''),M,y);y+=8;
  doc.text('Data: '+(p.data||''),M,y);y+=8;
  if(p.artNum){doc.text('ART: '+p.artNum,M,y);y+=8;}
  doc.setFont(undefined,'normal');
  if(_eq) doc.text('Equipamento: '+(_eq.tipo||'')+((_eq.marca||'')?' — '+_eq.marca:''),M,y);
  y+=8;if(_eq?.local) doc.text('Localização: '+_eq.local,M,y);
  y+=12;doc.setFontSize(9);doc.setTextColor(100,100,100);
  doc.text('Gerado via PMOC Digital · Eng. Alex Luiz de Souza Leandro',M,y);
  doc.save('PMOC_'+(p.num||'')+'_'+(p.ano||'')+'.pdf');
}

carregar();
</script>
</body>
</html>
